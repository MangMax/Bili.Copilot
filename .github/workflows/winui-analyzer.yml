name: WinUI Analyzer

# WinUI 官方分析器（Microsoft.Windows.SDK.BuildTools.WinUIAnalyzer）的阻断构建：
# 分析器已常驻 UI 工程的默认构建（#114），新写的 WUI 诊断会被 warnings-as-errors 直接
# 变成编译错误；本工作流在 Windows runner 上跑同一次构建，把诊断落成 SARIF 送 code scanning
# （基线、开关与回滚方式见 docs/agents/winui-analyzer.md）.
#
# 阻断：这里没有 continue-on-error，并且已纳入分支保护的必需检查（上下文名
# winui-analyzer-observation），构建变红就是合并被挡.
on:
  push:
    branches: [master]
  # 必需检查不能按路径过滤：没触发的 PR 会让检查一直停在 pending，永远等不到绿色.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # upload-sarif 要求写 security-events；本工作流只上传自己生成的 SARIF.
  security-events: write

jobs:
  # job id 就是分支保护里的必需检查名（winui-analyzer-observation），改名字会让规则失效；
  # "observation" 是历史遗留，现在它跑的是阻断构建.
  winui-analyzer-observation:
    runs-on: windows-latest
    env:
      Project_Path: src/Desktop/BiliCopilot.UI/BiliCopilot.UI.csproj
      # SARIF 文件名只在这里写一次：构建的输出路径、hashFiles 守卫、两处上传都从它派生，
      # 换位置时改这一行就够了. 必须保持工作区相对路径 —— hashFiles 只接受相对模式，
      # 绝对路径会让守卫永远为空、上传被静默跳过.
      Sarif_File: winui-analyzer.sarif
      # 送 code scanning 的是只含 WUI 规则的过滤副本（ErrorLog 里还混着 IDE/CA/RCS 诊断），
      # 完整 SARIF 仍作为 artifact 保留. 同样必须是工作区相对路径，供 hashFiles 守卫使用.
      Sarif_Wui_File: winui-analyzer-wui.sarif
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # 开关语义见 csproj 与 docs：WinUIAnalyzerObservation 只剩"把 ErrorLog 指向 SARIF"，
      # warnings-as-errors 照常开着，所以这一步既是报告也是门禁.
      # GenerateAppxPackageOnBuild=false 是因为 runner 上没有 libmpv 等运行时依赖，
      # 只要编译结果，不碰 MSIX 打包.
      # AppxPackageSigningEnabled=false：runner 上没有发布证书（CN=Mang），而 MSIX 打包管线
      # 即使在 GenerateAppxPackageOnBuild=false 时仍会跑签名校验，报
      # SigningCertificateThumbprintNotInStore 把构建打红；这个 job 只要编译诊断，不产包也不签名.
      - name: 阻断构建并生成 SARIF
        shell: pwsh
        run: |
          $common = @(
            "-p:Platform=x64",
            "-p:SolutionDir=${{ github.workspace }}/src/",
            "-p:WinUIAnalyzerObservation=true"
          )
          dotnet restore ${{ env.Project_Path }} @common
          # 绝对路径在这里拼：SARIF 落在工作区根目录，与下面 hashFiles 的相对模式对齐.
          $sarifPath = Join-Path $env:GITHUB_WORKSPACE $env:Sarif_File
          dotnet build ${{ env.Project_Path }} -c Release --no-restore @common `
            -p:GenerateAppxPackageOnBuild=false `
            -p:AppxPackageSigningEnabled=false `
            -p:WinUIAnalyzerSarifPath="$sarifPath"

      # 构建失败也照样跑：只汇总已经生成的内容.
      - name: 汇总 SARIF 中的 WUI 诊断
        if: always()
        shell: pwsh
        run: |
          $sarif = Join-Path $env:GITHUB_WORKSPACE $env:Sarif_File
          $summary = $env:GITHUB_STEP_SUMMARY
          if (!(Test-Path $sarif)) {
            "未生成 SARIF（构建失败或分析器未加载），详见上一步日志." | Out-File $summary -Append
            exit 0
          }

          $doc = Get-Content $sarif -Raw | ConvertFrom-Json
          $results = @($doc.runs | ForEach-Object { $_.results } | Where-Object { $_ })
          $wui = @($results | Where-Object { "$($_.ruleId)" -like "WUI*" })

          # 同一位置偶尔会被上报两次（见 docs/agents/winui-analyzer.md 的基线口径），
          # 按 "规则 + 位置" 去重，计数才能和基线对齐.
          $distinct = @($wui | Group-Object {
            $loc = $_.locations[0].physicalLocation
            "$($_.ruleId)|$($loc.artifactLocation.uri)|$($loc.region.startLine)|$($loc.region.startColumn)"
          } | ForEach-Object { $_.Group[0] })

          "### WinUI Analyzer 结果" | Out-File $summary -Append
          "" | Out-File $summary -Append
          "| 规则 | 数量 |" | Out-File $summary -Append
          "| --- | --- |" | Out-File $summary -Append
          $distinct | Group-Object ruleId | Sort-Object Count -Descending |
            ForEach-Object { "| $($_.Name) | $($_.Count) |" | Out-File $summary -Append }

          $warnings = @($distinct | Where-Object { $_.level -ne "note" }).Count
          $notes = @($distinct | Where-Object { $_.level -eq "note" }).Count
          "" | Out-File $summary -Append
          "WUI 合计 $($distinct.Count) 条：warning $warnings 条、note $notes 条；基线见 docs/agents/winui-analyzer.md." | Out-File $summary -Append
          "SARIF: $sarif" | Out-File $summary -Append

      # code scanning 只收 WUI 规则：ErrorLog 里混着 ~2751 条 IDE/CA/RCS 诊断，全量上传会把
      # 代码扫描变成 IDE 风格检查面板，还会留下规则已清零后的陈旧告警.
      # 这里保留 SARIF 信封（version、$schema、runs[0] 的 tool/artifacts/invocations 原样），
      # 只把 runs[0].results 换成 WUI* 子集；完整 SARIF 仍走下面的 artifact.
      - name: 过滤出 WUI 结果供 code scanning 使用
        if: always()
        shell: pwsh
        run: |
          $full = Join-Path $env:GITHUB_WORKSPACE $env:Sarif_File
          if (!(Test-Path $full)) {
            "未生成 SARIF，跳过过滤（构建失败或分析器未加载）." | Out-File $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }

          $filtered = Join-Path $env:GITHUB_WORKSPACE $env:Sarif_Wui_File
          $doc = Get-Content $full -Raw | ConvertFrom-Json
          $runs = @($doc.runs)
          if ($runs.Count -eq 0) {
            "SARIF 里没有 run，跳过过滤（多半是编译在写 ErrorLog 前就失败了）." | Out-File $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }

          $run = $runs[0]
          $wui = @(@($run.results) | Where-Object { "$($_.ruleId)" -like 'WUI*' })
          $run.results = @($wui)
          # 单 run：信封字段原样带过去，只替换结果集.
          $doc.runs = @($run)
          $doc | ConvertTo-Json -Depth 64 | Set-Content -Path $filtered -Encoding utf8

          $byRule = ($wui | Group-Object ruleId | Sort-Object Count -Descending |
            ForEach-Object { "$($_.Name) $($_.Count)" }) -join '、'
          $warnings = @($wui | Where-Object { $_.level -ne 'note' }).Count
          "已过滤 SARIF：WUI $($wui.Count) 条（$byRule），warning $warnings 条 -> $filtered" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: 上传 SARIF 工件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winui-analyzer-sarif
          path: ${{ env.Sarif_File }}
          if-no-files-found: warn
          retention-days: 30

      # 上传过滤副本（只含 WUI 规则），完整 SARIF 留在 artifact 里.
      # 有文件才上传：upload-sarif 拿到空的 sarif_file 会直接失败，用 hashFiles 兜住；
      # hashFiles 只认工作区相对模式，所以这两个文件名都不能是绝对路径.
      # fork PR 上 security-events 被降级成只读，upload-sarif 必然失败；这一步不再是
      # continue-on-error，所以在 fork PR 上直接跳过 —— 否则 WUI 诊断干净的外部 PR 也会
      # 被这个与规则无关的步骤挡红. SARIF 仍留在 artifact 里.
      - name: 上传 SARIF 到 code scanning
        if: always() && hashFiles(env.Sarif_Wui_File) != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.Sarif_Wui_File }}
          category: winui-analyzer
