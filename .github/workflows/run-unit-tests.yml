name: Run Unit Tests

on:
  push:
    branches: [master]
  # master 把 `test` 作为必需检查，所以每个 PR 都必须跑一次：
  # 带 paths 过滤时，不碰这些目录的 PR 不会触发工作流，必需检查会一直停在
  # pending（从未创建），把合并挡死. push 也去掉 paths 过滤，让 master 上的
  # 结果与 PR 一致.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # 独立于 WinUI / MSIX 打包流程：测试项目只链接与 UI 无关的纯逻辑源文件，
    # 因此可以在普通 Windows runner 上直接构建和运行，不需要 MSIX 工具链.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore tests/BiliCopilot.UI.Tests/BiliCopilot.UI.Tests.csproj

      # 显式构建一次：干净检出上直接 --no-build 运行测试可能报告 0 个测试.
      - name: Build
        run: dotnet build tests/BiliCopilot.UI.Tests/BiliCopilot.UI.Tests.csproj --no-restore -c Release

      - name: Test
        run: dotnet test tests/BiliCopilot.UI.Tests/BiliCopilot.UI.Tests.csproj --no-build -c Release --logger "console;verbosity=normal"

      # This mode links the real search page and omits navigation test files.
      # Keep the default build/test above. Always rebuild when switching modes:
      # --no-build here could silently run the previous default assembly.
      - name: Test search recovery regression
        run: dotnet test tests/BiliCopilot.UI.Tests/BiliCopilot.UI.Tests.csproj -c Release -p:SearchRecoveryRegression=true --filter FullyQualifiedName~SearchRecoveryInvestigationTests --logger "console;verbosity=normal"

      - name: Test popular card data and relationships
        run: dotnet test tests/BiliCopilot.PopularCard.Tests/BiliCopilot.PopularCard.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Test referenced bili-kernel
        run: dotnet test externals/bili-kernel/src/Tests/BiliKernel.Tests/BiliKernel.Tests.csproj -c Release --logger "console;verbosity=normal"
