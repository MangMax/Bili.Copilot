name: "Setup Environment"
description: "Sets up the build environment including .NET, libmpv, and dependencies"
inputs:
  version:
    description: "Version number"
    required: true
  sideload:
    description: "Is sideload build"
    required: false
    default: "false"
  platform:
    description: "Target platform (x64/arm64)"
    required: true
  configuration:
    description: "Build configuration"
    required: true
  solution-name:
    description: "Solution file path"
    required: true
  manifest-path:
    description: "Manifest file path"
    required: true
  gh-token:
    description: "GitHub Token for downloading libmpv"
    required: true

runs:
  using: "composite"
  steps:
    - name: Update Manifest
      shell: pwsh
      run: |
        $version = "${{ inputs.version }}"
        $sideload = "${{ inputs.sideload }}"
        $manifestPath = "${{ inputs.manifest-path }}"

        # Ensure version format x.x.x.x if user inputs x.x.x
        if ($version -match '^\d+\.\d+\.\d+$') {
            $version = "$version.0"
        }

        Write-Host "Updating manifest version to: $version"

        # Update Version
        (Get-Content $manifestPath) -replace '(?<!Min)Version="\d+\.\d+\.\d+\.\d+"', "Version=""$version""" | Set-Content $manifestPath

        # Update Publisher if Sideload
        if ($sideload -eq "true") {
            Write-Host "Sideload mode enabled. Updating Publisher to CN=Richasy"
            # Replace Publisher in Identity tag
            (Get-Content $manifestPath) -replace 'Publisher="CN=[A-F0-9-]+"', 'Publisher="CN=Richasy"' | Set-Content $manifestPath
        }

        # Verify change
        Get-Content $manifestPath | Select-String "Version="
        Get-Content $manifestPath | Select-String "Publisher="

    - name: Setup .NET from global.json
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Download and Setup Dependencies
      shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        $platform = "${{ inputs.platform }}"
        $mpvArch = if ($platform -eq "x64") { "x86_64" } else { "aarch64" }

        # Pinned native inputs. Update this block as a reviewed change; never
        # resolve "latest" at build time.
        $nativeRelease = "20261102"
        $mpvAssets = @{
            "x86_64"  = @{ Name = "mpv-dev-x86_64-20261102-git-2137d21b2e.7z";  Sha256 = "5ca801552661c18fa0b1edfd41dba6e5d9aa9d6d3d6c42dbe3fb91a45eb79f16" }
            "aarch64" = @{ Name = "mpv-dev-aarch64-20261102-git-2137d21b2e.7z"; Sha256 = "d762d653884e991486bc2f1132b614ddff4551922b8d13765383c121db4583fd" }
        }
        $ffmpegAssets = @{
            "x86_64"  = @{ Name = "ffmpeg-x86_64-git-e19fadf1d.7z";  Sha256 = "86884738568631b3ac029a5fd9aa6504526f86529255bac3aa917a08f569798c" }
            "aarch64" = @{ Name = "ffmpeg-aarch64-git-e19fadf1d.7z"; Sha256 = "c1c55d5fb1b3370838381ea057ddef2dd8a0d3260421a40800a51f62aa769089" }
        }

        $mpvAsset = $mpvAssets[$mpvArch]
        $ffmpegAsset = $ffmpegAssets[$mpvArch]
        if (-not $mpvAsset -or -not $ffmpegAsset) {
            Write-Error "Unsupported platform: $platform"
            exit 1
        }

        # --- libmpv setup ---
        $mpvTargetDir = "src/Desktop/BiliCopilot.UI/Assets/libmpv/$platform"

        Write-Host "Mapping platform $platform to mpv arch $mpvArch"

        # Create target directory
        New-Item -ItemType Directory -Force -Path $mpvTargetDir

        Write-Host "Downloading libmpv $($mpvAsset.Name) from release $nativeRelease..."
        gh release download $nativeRelease --repo shinchiro/mpv-winbuild-cmake --pattern $mpvAsset.Name --clobber

        if (-not (Test-Path $mpvAsset.Name)) {
            Write-Error "Failed to download $($mpvAsset.Name)"
            exit 1
        }

        $mpvHash = (Get-FileHash -Algorithm SHA256 $mpvAsset.Name).Hash.ToLowerInvariant()
        if ($mpvHash -ne $mpvAsset.Sha256) {
            Write-Error "SHA-256 mismatch for $($mpvAsset.Name): expected $($mpvAsset.Sha256), got $mpvHash"
            exit 1
        }

        # Extract libmpv-2.dll
        7z e "$($mpvAsset.Name)" -o"$mpvTargetDir" libmpv-2.dll -r -y

        if (Test-Path "$mpvTargetDir\libmpv-2.dll") {
            Write-Host "Successfully extracted libmpv-2.dll to $mpvTargetDir"
        } else {
            Write-Error "Failed to extract libmpv-2.dll"
            exit 1
        }

        # --- ffmpeg setup ---
        $ffmpegTargetDir = "src/Desktop/BiliCopilot.UI/Assets/ffmpeg/$platform"

        # Create target directory
        New-Item -ItemType Directory -Force -Path $ffmpegTargetDir

        Write-Host "Downloading ffmpeg $($ffmpegAsset.Name) from release $nativeRelease..."
        gh release download $nativeRelease --repo shinchiro/mpv-winbuild-cmake --pattern $ffmpegAsset.Name --clobber

        if (-not (Test-Path $ffmpegAsset.Name)) {
            Write-Error "Failed to download $($ffmpegAsset.Name)"
            exit 1
        }

        $ffmpegHash = (Get-FileHash -Algorithm SHA256 $ffmpegAsset.Name).Hash.ToLowerInvariant()
        if ($ffmpegHash -ne $ffmpegAsset.Sha256) {
            Write-Error "SHA-256 mismatch for $($ffmpegAsset.Name): expected $($ffmpegAsset.Sha256), got $ffmpegHash"
            exit 1
        }

        # Extract ffmpeg.exe
        7z e "$($ffmpegAsset.Name)" -o"$ffmpegTargetDir" ffmpeg.exe -r -y

        if (Test-Path "$ffmpegTargetDir\ffmpeg.exe") {
            Write-Host "Successfully extracted ffmpeg.exe to $ffmpegTargetDir"
        } else {
            Write-Error "Failed to extract ffmpeg.exe"
            exit 1
        }

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore dependencies
      shell: pwsh
      run: msbuild ${{ inputs.solution-name }} /t:Restore /p:Configuration=${{ inputs.configuration }}
